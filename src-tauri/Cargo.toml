[package]
name = "asaccounting"
version = "0.1.1"
description = "방과후 회계 검증 매니저"
authors = ["lohemal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "asaccounting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = "0.4"
log = { version = "0.4", features = ["std"] }
# Excel 읽기 — 순수 Rust, xlsx/xlsm/xls 모두 읽음. 형제 프로젝트(방과후 통합 매니저·견적서 통합 관리)에서
# 실제 양식을 읽는 데 검증된 라이브러리. P1 업로드에서 쓴다.
calamine = "0.26"
# SHA-256 — 같은 파일 재업로드 감지(upload_file.sha256).
sha2 = "0.10"
hex = "0.4"
# P5 백업 패키지(zip) · Excel 내보내기 · 임시 폴더
zip = { version = "2", default-features = false, features = ["deflate"] }
rust_xlsxwriter = "0.89"
tempfile = "3"
# P6 백업 암호화 — 인증 암호화(AES-256-GCM) + 비밀번호 키 유도(Argon2id) + Windows DPAPI(현재 계정용). 직접 구현하지 않는다.
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
base64 = "0.22"
rand = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory"] }
# P6 자동 업데이트 — 서명 검증 필수(공개키는 tauri.conf.json), 설치 뒤 재시작
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"
# 업데이트 서명(.sig) 검증 시험 — updater 와 같은 minisign 형식
minisign-verify = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
